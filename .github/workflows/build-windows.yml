name: Build Windows Win32 executable

on:
  workflow_dispatch:
  push:
    paths:
      - proyectoGrafica_OpenGL.zip
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build portable Win32 package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'source\proyectoGrafica_OpenGL'
          Expand-Archive -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'proyectoGrafica_OpenGL.zip') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Force

          $env:VCPKG_ROOT = Join-Path $env:RUNNER_TEMP 'vcpkg'
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # The upstream Assimp patch endpoint is rate-limited on hosted runners.
          $assimpPort = Join-Path $env:VCPKG_ROOT 'ports\assimp\portfile.cmake'
          $portText = Get-Content -LiteralPath $assimpPort -Raw
          $oldPatchUrl = 'https://github.com/assimp/assimp/commit/9a486a72e43f92222969bfac7054554f97dd253f.patch?full_index=1'
          if (-not $portText.Contains($oldPatchUrl)) { throw 'No encontré la URL esperada del parche Assimp en el portfile de vcpkg.' }
          $portText = $portText.Replace($oldPatchUrl, 'https://patch-diff.githubusercontent.com/raw/assimp/assimp/pull/6627.patch')
          $portText = $portText.Replace('209d79e2366567cc8090e06684ef2da795a317c81d17694590e95051a62123219ab9b700bd0640e5ae0dd0d8bb9d8c9377dadc9168f08968d3b970244dbdc353', '2e1533bb3f0679ea3bdfb5525f02bc939be6e8636973984ddf1657566b6ae9685b97282b2320738c6a6e4255b2aed7c0824151e146c52c55bb8588f712b208e7')
          Set-Content -LiteralPath $assimpPort -Value $portText -NoNewline -Encoding utf8

          & (Join-Path $env:VCPKG_ROOT 'bootstrap-vcpkg.bat') -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $toolchain = Join-Path $env:VCPKG_ROOT 'scripts\buildsystems\vcpkg.cmake'
          cmake -S $source -B (Join-Path $source 'build\win32') -G 'Visual Studio 17 2022' -A Win32 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static `
            '-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded$<$<CONFIG:Debug>:Debug>'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build (Join-Path $source 'build\win32') --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item (Join-Path $source 'build\win32\Release\proyectoGrafica_OpenGL.exe') $dist
          Copy-Item (Join-Path $source 'build\win32\assets') $dist -Recurse -Force
          Copy-Item (Join-Path $source 'build\win32\resources') $dist -Recurse -Force
          Compress-Archive -Path (Join-Path $dist '*') -DestinationPath (Join-Path $env:GITHUB_WORKSPACE 'proyectoGrafica_OpenGL-Windows-Win32.zip') -Force

      - name: Upload executable package
        uses: actions/upload-artifact@v4
        with:
          name: proyectoGrafica_OpenGL-Windows-Win32
          path: proyectoGrafica_OpenGL-Windows-Win32.zip
          if-no-files-found: error
          retention-days: 30
